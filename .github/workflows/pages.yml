name: Publish frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'system/public/**'
      - 'system/tests/timeline.test.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Validate scenario data and playback
        run: node --test system/tests/timeline.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: system/public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
